name: Build and deploy AI Brief Hub

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron uses UTC: 20:12 Asia/Shanghai = 12:12 UTC.
    - cron: "12 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      markdown_url: ${{ steps.metadata.outputs.markdown_url }}
      markdown_path: ${{ steps.metadata.outputs.markdown_path }}
      detail_url: ${{ steps.metadata.outputs.detail_url }}
      report_label: ${{ steps.metadata.outputs.report_label }}
      report_found: ${{ steps.metadata.outputs.report_found }}
      site_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Resolve report metadata
        id: metadata
        shell: bash
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          markdown_path=""

          # Prefer a Markdown report changed by this commit, without using a
          # short-circuiting pipeline that can fail under bash pipefail.
          while IFS= read -r path; do
            if [[ "$path" =~ ^content/.*\.md$ ]]; then
              markdown_path="$path"
              break
            fi
          done < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")

          # For workflow/template-only deployments, use the most recently
          # committed report from repository history.
          if [[ -z "$markdown_path" ]]; then
            while IFS= read -r path; do
              if [[ "$path" =~ ^content/.*\.md$ ]]; then
                markdown_path="$path"
                break
              fi
            done < <(git log --name-only --pretty=format: -- content)
          fi

          report_found="false"
          report_label="最新报告"
          markdown_url=""
          detail_url=""

          if [[ -n "$markdown_path" && -f "$markdown_path" ]]; then
            report_found="true"
            markdown_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${markdown_path}"

            permalink="$(awk -F': ' '/^permalink:/ { print $2; exit }' "$markdown_path" | tr -d '\r\"')"
            report_date="$(awk -F': ' '/^date:/ { print $2; exit }' "$markdown_path" | tr -d '\r\"')"
            today_shanghai="$(TZ=Asia/Shanghai date +%F)"

            if [[ -n "$permalink" ]]; then
              if [[ "$permalink" != /* ]]; then
                permalink="/$permalink"
              fi
              detail_url="${SITE_BASE_URL%/}${permalink}"
            fi

            if [[ "$report_date" == "$today_shanghai" ]]; then
              report_label="今日报告"
            fi
          fi

          echo "markdown_path=$markdown_path" >> "$GITHUB_OUTPUT"
          echo "markdown_url=$markdown_url" >> "$GITHUB_OUTPUT"
          echo "detail_url=$detail_url" >> "$GITHUB_OUTPUT"
          echo "report_label=$report_label" >> "$GITHUB_OUTPUT"
          echo "report_found=$report_found" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build site and search index
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYED_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          CONFIGURED_SITE_URL: ${{ needs.build.outputs.site_url }}
          DETAIL_URL: ${{ needs.build.outputs.detail_url }}
          REPORT_LABEL: ${{ needs.build.outputs.report_label }}
          REPORT_FOUND: ${{ needs.build.outputs.report_found }}
          MARKDOWN_URL: ${{ needs.build.outputs.markdown_url }}
          MARKDOWN_PATH: ${{ needs.build.outputs.markdown_path }}
        shell: bash
        run: |
          if [[ -z "$FEISHU_WEBHOOK_URL" ]]; then
            echo "FEISHU_WEBHOOK_URL is not configured; notification skipped."
            exit 0
          fi

          site_url="${DEPLOYED_PAGE_URL:-$CONFIGURED_SITE_URL}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            title="✅ AI Brief Hub 发布成功"
            status="构建和部署均已完成"
          else
            title="❌ AI Brief Hub 发布失败"
            status="build=${BUILD_RESULT}, deploy=${DEPLOY_RESULT}"
          fi

          if [[ "$REPORT_FOUND" == "true" && -n "$DETAIL_URL" ]]; then
            payload="$(jq -n \
              --arg title "$title" \
              --arg status "$status" \
              --arg label "$REPORT_LABEL" \
              --arg detail "$DETAIL_URL" \
              --arg markdown "$MARKDOWN_URL" \
              --arg path "$MARKDOWN_PATH" \
              --arg site "$site_url" \
              --arg workflow "$workflow_url" \
              '{
                msg_type:"post",
                content:{
                  post:{
                    zh_cn:{
                      title:$title,
                      content:[
                        [{tag:"text",text:$status}],
                        [{tag:"text",text:($label+"：")},{tag:"a",text:"打开报告",href:$detail}],
                        [{tag:"text",text:"Markdown："},{tag:"a",text:"查看源文件",href:$markdown}],
                        [{tag:"text",text:("文件路径："+$path)}],
                        [{tag:"text",text:"站点首页："},{tag:"a",text:"打开 AI Brief Hub",href:$site}],
                        [{tag:"text",text:"Workflow："},{tag:"a",text:"查看构建记录",href:$workflow}]
                      ]
                    }
                  }
                }
              }')"
          else
            payload="$(jq -n \
              --arg title "$title" \
              --arg status "$status" \
              --arg site "$site_url" \
              --arg workflow "$workflow_url" \
              '{
                msg_type:"post",
                content:{
                  post:{
                    zh_cn:{
                      title:$title,
                      content:[
                        [{tag:"text",text:$status}],
                        [{tag:"text",text:"本次未找到可发布的 Markdown 报告"}],
                        [{tag:"text",text:"站点首页："},{tag:"a",text:"打开 AI Brief Hub",href:$site}],
                        [{tag:"text",text:"Workflow："},{tag:"a",text:"查看构建记录",href:$workflow}]
                      ]
                    }
                  }
                }
              }')"
          fi

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$FEISHU_WEBHOOK_URL"
